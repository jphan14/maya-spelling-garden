<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maya's Spelling Garden</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');

:root {
  --green: #16a34a; --green2: #22c55e; --green-lt: #dcfce7;
  --leaf: #86efac; --pink: #f472b6; --pink-dk: #db2777;
  --sun: #fbbf24; --sun-dk: #d97706; --ink: #14532d;
  --bg: #f0fdf4; --rose-bg: #fff1f2; --red: #f43f5e;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg); min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
}
body::before {
  content: ''; position: fixed; width: 300px; height: 300px;
  background: rgba(134,239,172,0.35); border-radius: 50%; filter: blur(70px);
  top: -100px; right: -60px; pointer-events: none; z-index: 0;
}
body::after {
  content: ''; position: fixed; width: 240px; height: 240px;
  background: rgba(244,114,182,0.18); border-radius: 50%; filter: blur(70px);
  bottom: -60px; left: -40px; pointer-events: none; z-index: 0;
}

.screen { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 16px 18px; overflow-y: auto; }
.hidden { display: none !important; }

/* HOME */
#home-screen { justify-content: flex-start; gap: 14px; padding-top: 22px; }
.home-title { font-family: 'Fredoka One', sans-serif; font-size: 27px; color: var(--ink); text-align: center; }
.home-title span { color: var(--green); }
.home-sub { font-size: 13px; font-weight: 700; color: var(--green); opacity: 0.75; text-align: center; }
.home-stats { font-size: 12px; font-weight: 700; color: var(--pink-dk); opacity: 0.85; text-align: center; }

.section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--green); opacity: 0.65; align-self: flex-start; }

.mode-toggle { display: flex; gap: 8px; width: 100%; max-width: 380px; }
.mode-btn {
  flex: 1; background: #fff; border: 2.5px solid var(--leaf); border-radius: 16px;
  padding: 12px 8px; text-align: center; cursor: pointer; transition: transform 0.12s;
  font-family: 'Fredoka One', sans-serif; font-size: 14px; color: var(--ink);
}
.mode-btn:active { transform: scale(0.96); }
.mode-btn .mode-em { font-size: 20px; display: block; margin-bottom: 2px; }
.mode-btn.selected { border-color: var(--green); background: var(--green-lt); box-shadow: 0 0 0 2px var(--green); }

.chip-row { display: flex; gap: 8px; width: 100%; max-width: 380px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; background: #fff; border: 2px solid var(--leaf); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: center; min-width: 76px; transition: transform 0.12s; }
.chip:active { transform: scale(0.93); }
.chip.selected { border-color: var(--green); background: var(--green-lt); box-shadow: 0 0 0 2px var(--green); }
.chip.done { background: #fce7f3; border-color: var(--pink); }
.chip-em { font-size: 20px; }
.chip-num { font-size: 10px; font-weight: 800; color: var(--ink); }
.chip-pat { font-size: 9px; font-weight: 700; color: var(--green); opacity: 0.75; line-height: 1.2; }

.start-btn { background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; border: none; border-radius: 20px; font-family: 'Fredoka One', sans-serif; font-size: 22px; padding: 16px 0; width: 100%; max-width: 380px; cursor: pointer; box-shadow: 0 6px 24px rgba(22,163,74,0.35); transition: transform 0.12s; margin-top: 4px; }
.start-btn:active { transform: scale(0.97); }

/* GAME */
#game-screen { justify-content: flex-start; padding: 0; gap: 0; }
.top-bar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; flex-shrink: 0; }
.back-btn { background: #fff; border: none; border-radius: 12px; width: 40px; height: 40px; font-size: 18px; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 10px rgba(22,163,74,0.12); transition: transform 0.1s; }
.back-btn:active { transform: scale(0.93); }
.top-center { flex: 1; text-align: center; margin: 0 8px; }
.week-lbl { font-family: 'Fredoka One', sans-serif; font-size: 14px; color: var(--ink); }
.mode-badge { display: inline-block; background: var(--green-lt); border: 1.5px solid var(--leaf); border-radius: 99px; padding: 2px 10px; font-size: 11px; font-weight: 800; color: var(--green); margin-top: 2px; }
.flower-badge { background: var(--sun); border-radius: 12px; padding: 5px 11px; font-size: 13px; font-weight: 800; color: var(--sun-dk); white-space: nowrap; }

.dots-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 4px 14px 10px; flex-shrink: 0; }
.dot { font-size: 15px; opacity: 0.55; transition: transform 0.3s, opacity 0.3s; }
.dot.current { transform: scale(1.3); opacity: 1; }
.dot.correct { opacity: 1; }
.dot.revealed { opacity: 0.7; }

.word-area { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 6px 18px 8px; }

.word-card {
  background: #fff; border-radius: 24px; padding: 26px 20px;
  box-shadow: 0 4px 20px rgba(22,163,74,0.12);
  border: 3px solid var(--leaf);
  width: 100%; max-width: 380px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  transition: border-color 0.3s, background 0.3s;
  transform-origin: center;
}
.word-card.correct-bounce { animation: cardBounce 0.5s cubic-bezier(.34,1.56,.64,1) forwards; border-color: var(--green) !important; background: #f0fdf4 !important; }
@keyframes cardBounce { 0%{transform:scale(1)} 30%{transform:scale(1.05) rotate(-1deg)} 60%{transform:scale(0.98) rotate(1deg)} 100%{transform:scale(1) rotate(0)} }
.word-card.wrong-shake { animation: cardShake 0.4s ease; border-color: var(--red) !important; background: var(--rose-bg) !important; }
@keyframes cardShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px) rotate(-1deg)} 40%{transform:translateX(8px) rotate(1deg)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.word-card.revealed { border-color: var(--sun) !important; background: #fffbeb !important; }

.word-emoji { font-size: 52px; line-height: 1; }

.speak-btn {
  background: linear-gradient(135deg, var(--pink), var(--pink-dk)); color: #fff; border: none;
  border-radius: 50%; width: 62px; height: 62px; font-size: 26px; cursor: pointer;
  box-shadow: 0 5px 0 #9d174d, 0 8px 18px rgba(219,39,119,0.35);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.speak-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #9d174d !important; }
.speak-btn.pulse { animation: speakPulse 1.4s ease-in-out infinite; }
@keyframes speakPulse { 0%,100%{box-shadow:0 5px 0 #9d174d,0 8px 18px rgba(219,39,119,0.35)} 50%{box-shadow:0 5px 0 #9d174d,0 8px 26px rgba(219,39,119,0.6)} }

.attempt-msg { font-size: 13px; font-weight: 800; color: var(--pink-dk); min-height: 18px; text-align: center; }
.attempt-msg.reveal-msg { color: var(--sun-dk); }

/* Listen & Spell input */
.spell-input {
  width: 100%; max-width: 280px; font-family: 'Fredoka One', sans-serif;
  font-size: 26px; text-align: center; letter-spacing: 3px; color: var(--ink);
  border: 3px solid var(--leaf); border-radius: 16px; padding: 12px 10px;
  background: var(--green-lt); text-transform: lowercase;
}
.spell-input:focus { outline: none; border-color: var(--green); background: #fff; }
.spell-input.wrong-field { border-color: var(--red); background: var(--rose-bg); }
.spell-input.correct-field { border-color: var(--green); background: #d1fae5; }

/* Fill in the blank letter boxes */
.letter-boxes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.letter-box {
  width: 42px; height: 52px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka One', sans-serif; font-size: 24px; color: var(--ink);
  text-transform: lowercase;
}
.letter-box.static { background: var(--green-lt); border: 2.5px solid var(--leaf); }
.letter-box input {
  width: 100%; height: 100%; border-radius: 12px; border: 2.5px solid var(--pink);
  background: #fff; text-align: center; font-family: 'Fredoka One', sans-serif;
  font-size: 24px; color: var(--pink-dk); text-transform: lowercase;
  padding: 0;
}
.letter-box input:focus { outline: none; border-color: var(--pink-dk); background: #fce7f3; }
.letter-box input.wrong-field { border-color: var(--red); background: var(--rose-bg); color: var(--red); }
.letter-box input.correct-field { border-color: var(--green); background: #d1fae5; color: var(--green); }

.check-btn { width: calc(100% - 28px); max-width: 380px; background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; border: none; border-radius: 18px; font-family: 'Fredoka One', sans-serif; font-size: 20px; padding: 14px 0; cursor: pointer; box-shadow: 0 5px 0 #15803d, 0 8px 18px rgba(22,163,74,0.3); transition: transform 0.12s, opacity 0.2s; flex-shrink: 0; margin: 10px 0 16px; }
.check-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d !important; }
.check-btn:disabled { opacity: 0.35; pointer-events: none; }

/* RESULTS */
#results-screen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #14532d 0%, #15803d 55%, #22c55e 100%);
  gap: 16px; text-align: center; padding: 24px;
}
#results-screen.hidden { display: none; }
.results-flowers { font-size: 40px; letter-spacing: 8px; animation: flowersIn 0.6s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes flowersIn { from{transform:scale(0) rotate(-30deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
.results-title { font-family: 'Fredoka One', sans-serif; font-size: 42px; color: var(--sun); text-shadow: 0 4px 20px rgba(251,191,36,0.5); animation: titleDrop 0.7s cubic-bezier(.34,1.56,.64,1) 0.2s both; line-height: 1.15; }
@keyframes titleDrop { from{transform:translateY(-60px) scale(0.5);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }
.results-sub { font-family: 'Fredoka One', sans-serif; font-size: 20px; color: rgba(255,255,255,0.92); animation: fadeUp 0.6s ease 0.4s both; }
@keyframes fadeUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
.results-btns { display: flex; gap: 10px; width: 100%; max-width: 340px; animation: fadeUp 0.6s ease 0.6s both; }
.results-btn { flex: 1; background: var(--sun); color: var(--ink); border: none; border-radius: 16px; font-family: 'Fredoka One', sans-serif; font-size: 16px; padding: 14px 10px; cursor: pointer; box-shadow: 0 5px 0 var(--sun-dk), 0 8px 20px rgba(251,191,36,0.4); transition: transform 0.12s; }
.results-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sun-dk) !important; }
.results-btn.secondary { background: #fff; color: var(--green); box-shadow: 0 5px 0 var(--leaf), 0 8px 20px rgba(255,255,255,0.2); }
.results-btn.secondary:active { box-shadow: 0 2px 0 var(--leaf) !important; }
.results-love { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.6); animation: fadeUp 0.6s ease 0.7s both; }

.confetti-piece { position: fixed; pointer-events: none; z-index: 300; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(105vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="home-screen">
  <div class="home-title"><span>Maya's</span> Spelling Garden 🌷</div>
  <div class="home-sub">Listen to the word, then spell it!</div>
  <div class="home-stats" id="home-stats">0 flowers grown so far! 🌱</div>

  <div class="section-label">Practice mode</div>
  <div class="mode-toggle" id="mode-toggle">
    <div class="mode-btn" data-mode="listen"><span class="mode-em">🐝</span>Listen &amp; Spell</div>
    <div class="mode-btn" data-mode="fill"><span class="mode-em">✏️</span>Fill in the Blank</div>
  </div>

  <div class="section-label">Choose a week</div>
  <div class="chip-row" id="chip-row"></div>

  <button class="start-btn" onclick="startSession()">🌼 Start, Maya!</button>
</div>

<!-- GAME -->
<div class="screen hidden" id="game-screen">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="top-center">
      <div class="week-lbl" id="week-lbl">Aug 31</div>
      <div class="mode-badge" id="mode-badge">Listen &amp; Spell</div>
    </div>
    <div class="flower-badge">🌸 <span id="flower-count">0</span></div>
  </div>
  <div class="dots-row" id="dots-row"></div>
  <div class="word-area">
    <div class="word-card" id="word-card">
      <div class="word-emoji hidden" id="word-emoji"></div>
      <button class="speak-btn pulse" id="speak-btn" onclick="onSpeakTap()">🔊</button>
      <div class="attempt-msg" id="attempt-msg">&nbsp;</div>
      <input type="text" class="spell-input hidden" id="spell-input"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text">
      <div class="letter-boxes hidden" id="letter-boxes"></div>
    </div>
  </div>
  <button class="check-btn" id="check-btn" onclick="onCheck()" disabled>✅ Check!</button>
</div>

<!-- RESULTS -->
<div class="screen hidden" id="results-screen">
  <div class="results-flowers" id="results-flowers">🌸 🌸 🌸</div>
  <div class="results-title" id="results-title">Great growing!</div>
  <div class="results-sub" id="results-sub">10 out of 12 words!</div>
  <div class="results-btns">
    <button class="results-btn secondary" onclick="goHome()">🏡 Home</button>
    <button class="results-btn" onclick="startSession()">🔁 Play Again</button>
  </div>
  <div class="results-love">Made with love, just for Maya 💚</div>
</div>

var MODE = 'listen';       // 'listen' or 'fill'
var selectedWeekId = null; // week id string, or 'all'
var session = [];          // array of { word, emoji, audio, attempts, status }
var sessionIndex = 0;
var correctCount = 0;
var revealedCount = 0;
var dotEls = [];

/* ---------- storage helpers ---------- */
function getFlowersTotal() { try { return parseInt(localStorage.getItem('msg_flowers') || '0') || 0; } catch(e) { return 0; } }
function addFlowersTotal(n) { try { localStorage.setItem('msg_flowers', getFlowersTotal() + n); } catch(e) {} }
function getPerfectWeeks() { try { return JSON.parse(localStorage.getItem('msg_perfect_weeks') || '[]'); } catch(e) { return []; } }
function markWeekPerfect(id) {
  var list = getPerfectWeeks();
  if (list.indexOf(id) === -1) { list.push(id); try { localStorage.setItem('msg_perfect_weeks', JSON.stringify(list)); } catch(e) {} }
}

function shuffle(arr) {
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- speech ---------- */
function speak(wordObj) {
  if (!wordObj) return;
  if (wordObj.audio) {
    try {
      var audio = new Audio(wordObj.audio);
      audio.play()['catch'](function() {});
      return;
    } catch (e) {}
  }
  if ('speechSynthesis' in window) {
    try {
      speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(wordObj.word);
      utter.rate = 0.8;
      speechSynthesis.speak(utter);
    } catch (e) {}
  }
}

function onSpeakTap() {
  var item = session[sessionIndex];
  speak(item);
}

/* ---------- home screen ---------- */
function allWeekWords() {
  var out = [], seen = {};
  for (var i = 0; i < WEEKS.length; i++) {
    var words = WEEKS[i].words;
    for (var j = 0; j < words.length; j++) {
      if (!seen[words[j].word]) { seen[words[j].word] = true; out.push(words[j]); }
    }
  }
  return out;
}

function buildChips() {
  var perfect = getPerfectWeeks();
  var row = document.getElementById('chip-row');
  row.innerHTML = '';

  var allChip = document.createElement('div');
  allChip.className = 'chip' + (selectedWeekId === 'all' ? ' selected' : '');
  allChip.innerHTML = '<div class="chip-em">🌻</div><div class="chip-num">All Words</div><div class="chip-pat">Everything</div>';
  allChip.onclick = function() { selectedWeekId = 'all'; buildChips(); };
  row.appendChild(allChip);

  for (var i = 0; i < WEEKS.length; i++) {
    (function(idx) {
      var w = WEEKS[idx];
      var isDone = perfect.indexOf(w.id) !== -1;
      var chip = document.createElement('div');
      chip.className = 'chip' + (selectedWeekId === w.id ? ' selected' : '') + (isDone ? ' done' : '');
      chip.innerHTML = '<div class="chip-em">🌱' + (isDone ? '🌸' : '') + '</div>' +
        '<div class="chip-num">' + w.label + '</div>' +
        '<div class="chip-pat">' + w.focus + '</div>';
      chip.onclick = function() { selectedWeekId = w.id; buildChips(); };
      row.appendChild(chip);
    })(i);
  }
}

function buildModeToggle() {
  var btns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'mode-btn' + (btns[i].getAttribute('data-mode') === MODE ? ' selected' : '');
    btns[i].onclick = (function(el) {
      return function() { MODE = el.getAttribute('data-mode'); buildModeToggle(); };
    })(btns[i]);
  }
}

function updateHomeStats() {
  var f = getFlowersTotal();
  document.getElementById('home-stats').textContent =
    f > 0 ? f + ' flower' + (f === 1 ? '' : 's') + ' grown so far! 🌸' : '0 flowers grown so far! 🌱';
}

function showScreen(id) {
  var all = ['home-screen', 'game-screen', 'results-screen'];
  for (var i = 0; i < all.length; i++) {
    var el = document.getElementById(all[i]);
    if (el) el.className = el.id === id ? 'screen' : 'screen hidden';
  }
}

function clearConfetti() {
  var pieces = document.querySelectorAll('.confetti-piece');
  for (var i = 0; i < pieces.length; i++) { pieces[i].parentNode && pieces[i].parentNode.removeChild(pieces[i]); }
}

function goHome() {
  clearConfetti();
  showScreen('home-screen');
  buildChips();
  buildModeToggle();
  updateHomeStats();
}

/* ---------- session setup ---------- */
function startSession() {
  clearConfetti();
  if (!selectedWeekId) selectedWeekId = WEEKS.length ? WEEKS[0].id : 'all';

  var words;
  var label, focus;
  if (selectedWeekId === 'all') {
    words = allWeekWords();
    label = 'All Words';
    focus = 'Full garden mix';
  } else {
    var week = null;
    for (var i = 0; i < WEEKS.length; i++) { if (WEEKS[i].id === selectedWeekId) week = WEEKS[i]; }
    if (!week) week = WEEKS[0];
    words = week.words;
    label = week.label;
    focus = week.focus;
  }

  session = [];
  var shuffled = shuffle(words);
  for (var j = 0; j < shuffled.length; j++) {
    session.push({
      word: shuffled[j].word,
      emoji: shuffled[j].emoji || null,
      audio: shuffled[j].audio || null,
      attempts: 0,
      status: 'pending'
    });
  }
  sessionIndex = 0;
  correctCount = 0;
  revealedCount = 0;

  document.getElementById('week-lbl').textContent = label;
  document.getElementById('mode-badge').textContent = MODE === 'listen' ? 'Listen & Spell' : 'Fill in the Blank';
  document.getElementById('flower-count').textContent = getFlowersTotal();

  buildDots();
  showScreen('game-screen');
  loadWord(0);
}

function buildDots() {
  var row = document.getElementById('dots-row');
  row.innerHTML = '';
  dotEls = [];
  for (var i = 0; i < session.length; i++) {
    var d = document.createElement('span');
    d.className = 'dot';
    d.textContent = '🌱';
    row.appendChild(d);
    dotEls.push(d);
  }
}

function updateDots() {
  for (var i = 0; i < dotEls.length; i++) {
    var item = session[i];
    var cls = 'dot';
    if (i === sessionIndex) cls += ' current';
    if (item.status === 'correct') { cls += ' correct'; dotEls[i].textContent = '🌸'; }
    else if (item.status === 'revealed') { cls += ' revealed'; dotEls[i].textContent = '🥀'; }
    else { dotEls[i].textContent = '🌱'; }
    dotEls[i].className = cls;
  }
}

/* ---------- word rendering ---------- */
function pickBlankPositions(word) {
  var len = word.length;
  var count = len <= 2 ? 1 : 2;
  var idxs = [];
  for (var i = 0; i < len; i++) idxs.push(i);
  idxs = shuffle(idxs).slice(0, count);
  idxs.sort(function(a, b) { return a - b; });
  return idxs;
}

function loadWord(idx) {
  sessionIndex = idx;
  var item = session[idx];
  item.blanks = pickBlankPositions(item.word);

  var card = document.getElementById('word-card');
  card.className = 'word-card';

  var emojiEl = document.getElementById('word-emoji');
  if (item.emoji) { emojiEl.textContent = item.emoji; emojiEl.className = 'word-emoji'; }
  else { emojiEl.className = 'word-emoji hidden'; }

  document.getElementById('attempt-msg').textContent = ' ';
  document.getElementById('attempt-msg').className = 'attempt-msg';

  var spellInput = document.getElementById('spell-input');
  var letterBoxes = document.getElementById('letter-boxes');

  if (MODE === 'listen') {
    spellInput.className = 'spell-input';
    spellInput.value = '';
    letterBoxes.className = 'letter-boxes hidden';
    letterBoxes.innerHTML = '';
    spellInput.oninput = function() {
      document.getElementById('check-btn').disabled = spellInput.value.trim().length === 0;
    };
    setTimeout(function() { spellInput.focus(); }, 250);
  } else {
    spellInput.className = 'spell-input hidden';
    letterBoxes.className = 'letter-boxes';
    buildLetterBoxes(item);
  }

  document.getElementById('check-btn').disabled = true;
  document.getElementById('check-btn').textContent = '✅ Check!';
  updateDots();

  setTimeout(function() { speak(item); }, 350);
}

function buildLetterBoxes(item) {
  var wrap = document.getElementById('letter-boxes');
  wrap.innerHTML = '';
  var inputs = [];
  for (var i = 0; i < item.word.length; i++) {
    var box = document.createElement('div');
    var isBlank = item.blanks.indexOf(i) !== -1;
    if (isBlank) {
      box.className = 'letter-box';
      var inp = document.createElement('input');
      inp.setAttribute('maxlength', '1');
      inp.setAttribute('autocapitalize', 'off');
      inp.setAttribute('autocomplete', 'off');
      inp.setAttribute('autocorrect', 'off');
      inp.setAttribute('spellcheck', 'false');
      inp.setAttribute('inputmode', 'text');
      inp.setAttribute('data-pos', String(i));
      box.appendChild(inp);
      inputs.push(inp);
    } else {
      box.className = 'letter-box static';
      box.textContent = item.word.charAt(i);
    }
    wrap.appendChild(box);
  }

  for (var k = 0; k < inputs.length; k++) {
    (function(k) {
      inputs[k].oninput = function() {
        inputs[k].value = inputs[k].value.slice(-1);
        if (inputs[k].value && k < inputs.length - 1) inputs[k + 1].focus();
        checkAllBlanksFilled(inputs);
      };
      inputs[k].onkeydown = function(e) {
        if (e.key === 'Backspace' && !inputs[k].value && k > 0) inputs[k - 1].focus();
      };
    })(k);
  }

  if (inputs.length) setTimeout(function() { inputs[0].focus(); }, 250);
  checkAllBlanksFilled(inputs);
}

function checkAllBlanksFilled(inputs) {
  var filled = true;
  for (var i = 0; i < inputs.length; i++) { if (!inputs[i].value) filled = false; }
  document.getElementById('check-btn').disabled = !filled;
}

/* ---------- checking answers ---------- */
function onCheck() {
  var item = session[sessionIndex];
  var correct;

  if (MODE === 'listen') {
    var val = document.getElementById('spell-input').value.trim().toLowerCase();
    correct = val === item.word;
    var spellInput = document.getElementById('spell-input');
    spellInput.className = 'spell-input ' + (correct ? 'correct-field' : 'wrong-field');
  } else {
    var inputs = document.querySelectorAll('#letter-boxes input');
    correct = true;
    for (var i = 0; i < inputs.length; i++) {
      var pos = parseInt(inputs[i].getAttribute('data-pos'), 10);
      var ok = inputs[i].value.toLowerCase() === item.word.charAt(pos);
      inputs[i].className = ok ? 'correct-field' : 'wrong-field';
      if (!ok) correct = false;
    }
  }

  item.attempts++;

  if (correct) { onCorrectAnswer(item); }
  else if (item.attempts >= 2) { onReveal(item); }
  else { onWrongAnswer(item); }
}

function onCorrectAnswer(item) {
  item.status = 'correct';
  correctCount++;
  addFlowersTotal(1);
  document.getElementById('flower-count').textContent = getFlowersTotal();

  var card = document.getElementById('word-card');
  card.className = 'word-card correct-bounce';
  document.getElementById('attempt-msg').textContent = 'Yay! 🌸';
  document.getElementById('attempt-msg').className = 'attempt-msg';
  document.getElementById('check-btn').disabled = true;
  updateDots();

  setTimeout(nextWord, 1100);
}

function onWrongAnswer(item) {
  var card = document.getElementById('word-card');
  card.className = 'word-card wrong-shake';
  document.getElementById('attempt-msg').textContent = 'Try again! Listen closely 🔊';
  document.getElementById('attempt-msg').className = 'attempt-msg';

  setTimeout(function() {
    card.className = 'word-card';
    if (MODE === 'listen') {
      var spellInput = document.getElementById('spell-input');
      spellInput.value = '';
      spellInput.className = 'spell-input';
      document.getElementById('check-btn').disabled = true;
      spellInput.focus();
    } else {
      var inputs = document.querySelectorAll('#letter-boxes input');
      for (var i = 0; i < inputs.length; i++) { inputs[i].value = ''; inputs[i].className = ''; }
      document.getElementById('check-btn').disabled = true;
      if (inputs.length) inputs[0].focus();
    }
    speak(item);
  }, 500);
}

function onReveal(item) {
  item.status = 'revealed';
  revealedCount++;

  var card = document.getElementById('word-card');
  card.className = 'word-card revealed';
  document.getElementById('attempt-msg').textContent = 'The word is "' + item.word + '" 🌼';
  document.getElementById('attempt-msg').className = 'attempt-msg reveal-msg';
  document.getElementById('check-btn').disabled = true;

  if (MODE === 'listen') {
    var spellInput = document.getElementById('spell-input');
    spellInput.value = item.word;
    spellInput.className = 'spell-input';
  } else {
    var inputs = document.querySelectorAll('#letter-boxes input');
    for (var i = 0; i < inputs.length; i++) {
      var pos = parseInt(inputs[i].getAttribute('data-pos'), 10);
      inputs[i].value = item.word.charAt(pos);
      inputs[i].className = '';
    }
  }
  updateDots();

  setTimeout(nextWord, 1800);
}

function nextWord() {
  var next = sessionIndex + 1;
  if (next >= session.length) { finishSession(); }
  else { loadWord(next); }
}

/* ---------- results ---------- */
function finishSession() {
  if (revealedCount === 0 && correctCount === session.length && selectedWeekId !== 'all') {
    markWeekPerfect(selectedWeekId);
  }

  var total = session.length;
  document.getElementById('results-flowers').textContent = correctCount === total ? '🌸 🌸 🌸' : '🌱 🌸 🌱';

  var title, sub;
  if (correctCount === total) { title = 'Perfect Garden! 🌟'; }
  else if (correctCount >= total * 0.7) { title = 'Great growing! 🌷'; }
  else { title = 'Keep growing! 🌱'; }
  sub = correctCount + ' out of ' + total + ' words!';

  document.getElementById('results-title').textContent = title;
  document.getElementById('results-sub').textContent = sub;

  showScreen('results-screen');
  launchConfetti();
}

function launchConfetti() {
  var colors = ['#16a34a', '#f472b6', '#fbbf24', '#86efac', '#f9a8d4'];
  for (var i = 0; i < 40; i++) {
    (function() {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var size = 6 + Math.random() * 6;
      piece.style.width = size + 'px';
      piece.style.height = (size * 1.4) + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.top = '-20px';
      piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      piece.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(piece);
      setTimeout(function() { piece.parentNode && piece.parentNode.removeChild(piece); }, 4000);
    })();
  }
}

/* ---------- init ---------- */
function init() {
  selectedWeekId = WEEKS.length ? WEEKS[0].id : 'all';
  buildChips();
  buildModeToggle();
  updateHomeStats();
}
init();
</script>
